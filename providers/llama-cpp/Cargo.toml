[package]
name = "llama-cpp-provider"
version = "0.1.0"
edition = "2024"

[dependencies]
contract = { path = "../../contract" }
runtime = { path = "../../runtime" }
llama-cpp-2 = { version = "0.1.151", optional = true }
encoding_rs = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
default = []
real-inference = ["llama-cpp-2", "encoding_rs"]

[[example]]
name = "inference"
path = "examples/inference.rs"
required-features = ["real-inference"]
